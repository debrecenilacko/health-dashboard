name = "egeszseg-dashboard-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Nem-titkos azonosítók (a database ID önmagában nem ad hozzáférést,
# csak a NOTION_TOKEN-nel együtt jelent bármit).
[vars]
DB_MERESEK = "4d695207ed7a44fc8aa13d448c698b41"
DB_AKTIVITAS = "1b187bd8d6e94e44979c7ce1e8bbc965"
DB_ETKEZESEK = "92cc59f37816407fae6da0a49651889a"
DB_CHECKLIST = "ce6cc97411f347adbfdbe2cd0a9ba080"
DB_LABOR = "4702e64e3353476cb2a1c63ba70a1683"

# A NOTION_TOKEN és APP_TOKEN NEM ide kerül — azokat titokként kell
# beállítani (lásd README): wrangler secret put NOTION_TOKEN

# Coach jegyzetek cache — csak akkor generálunk újat az Anthropic API-val,
# ha a mérési/labor adat ténylegesen változott az utolsó generálás óta.
[[kv_namespaces]]
binding = "COACH_KV"
id = "6687f63fbd674b75b72ed3154753b2ba"

# Hetente egyszer (hétfő reggel) ellenőrzi, hogy változott-e a mérési/labor
# adat, és ha igen, akkor (és csak akkor) hívja az Anthropic API-t új coach
# jegyzetekért.
[triggers]
crons = ["0 6 * * 1"]
